services:
  api:
    build:
      context: ./apps/api
    environment:
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/whisper-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ko}
      WHISPER_PREPROCESS_AUDIO: ${WHISPER_PREPROCESS_AUDIO:-true}
      WHISPER_INITIAL_PROMPT: ${WHISPER_INITIAL_PROMPT:-국민권익위원회 상담 통화입니다. 민원, 접수번호, 담당 부서, 처리 상태를 정확히 전사하세요.}
      WHISPER_HOTWORDS: ${WHISPER_HOTWORDS:-국민권익위원회, 민원, 접수번호, 담당 부서, 처리 상태, 상담원}
      WHISPER_CONDITION_ON_PREVIOUS_TEXT: ${WHISPER_CONDITION_ON_PREVIOUS_TEXT:-false}
      WHISPER_VAD_THRESHOLD: ${WHISPER_VAD_THRESHOLD:-0.35}
      WHISPER_MIN_SILENCE_DURATION_MS: ${WHISPER_MIN_SILENCE_DURATION_MS:-500}
      WHISPER_SPEECH_PAD_MS: ${WHISPER_SPEECH_PAD_MS:-400}
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_CONTEXT_WINDOW: ${OLLAMA_CONTEXT_WINDOW:-32768}
      OLLAMA_MAX_INPUT_CHARS: ${OLLAMA_MAX_INPUT_CHARS:-40000}
      DATABASE_PATH: /data/acrc_call_log.db
      UPLOAD_DIR: /data/uploads
      PROCESSED_DIR: /data/processed
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./storage:/data
      - ./storage/models:/models:ro
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

