services:
  api:
    build:
      context: ./apps/api
      args:
        REQUIREMENTS_FILE: ${API_REQUIREMENTS_FILE:-requirements.txt}
    environment:
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/whisper-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ko}
      WHISPER_PREPROCESS_AUDIO: ${WHISPER_PREPROCESS_AUDIO:-true}
      WHISPER_INITIAL_PROMPT: ${WHISPER_INITIAL_PROMPT:-}
      WHISPER_HOTWORDS: ${WHISPER_HOTWORDS:-}
      WHISPER_CONDITION_ON_PREVIOUS_TEXT: ${WHISPER_CONDITION_ON_PREVIOUS_TEXT:-false}
      WHISPER_VAD_THRESHOLD: ${WHISPER_VAD_THRESHOLD:-0.5}
      WHISPER_MIN_SILENCE_DURATION_MS: ${WHISPER_MIN_SILENCE_DURATION_MS:-700}
      WHISPER_SPEECH_PAD_MS: ${WHISPER_SPEECH_PAD_MS:-200}
      WHISPER_NO_SPEECH_THRESHOLD: ${WHISPER_NO_SPEECH_THRESHOLD:-0.5}
      WHISPER_LOG_PROB_THRESHOLD: ${WHISPER_LOG_PROB_THRESHOLD:--0.8}
      WHISPER_COMPRESSION_RATIO_THRESHOLD: ${WHISPER_COMPRESSION_RATIO_THRESHOLD:-2.2}
      WHISPER_HALLUCINATION_SILENCE_THRESHOLD: ${WHISPER_HALLUCINATION_SILENCE_THRESHOLD:-1.0}
      DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-none}
      DIARIZATION_MODEL_PATH: ${DIARIZATION_MODEL_PATH:-/models/pyannote-speaker-diarization-community-1}
      DIARIZATION_DEVICE: ${DIARIZATION_DEVICE:-cpu}
      DIARIZATION_MIN_SPEAKERS: ${DIARIZATION_MIN_SPEAKERS:-}
      DIARIZATION_MAX_SPEAKERS: ${DIARIZATION_MAX_SPEAKERS:-}
      PYANNOTE_METRICS_ENABLED: ${PYANNOTE_METRICS_ENABLED:-0}
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_CONTEXT_WINDOW: ${OLLAMA_CONTEXT_WINDOW:-32768}
      OLLAMA_MAX_INPUT_CHARS: ${OLLAMA_MAX_INPUT_CHARS:-40000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-180}
      GEMINI_MAX_INPUT_CHARS: ${GEMINI_MAX_INPUT_CHARS:-40000}
      DATABASE_PATH: /data/acrc_call_log.db
      UPLOAD_DIR: /data/uploads
      PROCESSED_DIR: /data/processed
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./storage:/data
      - ./storage/models:/models:ro
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

